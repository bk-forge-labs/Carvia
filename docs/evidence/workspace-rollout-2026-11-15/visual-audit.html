<!doctype html><html><head><title>Veltrenne visual audit</title><style>body{font:13px Arial;background:#ddd;margin:0}header{position:sticky;top:0;padding:10px;background:white;z-index:100;display:flex;gap:16px;align-items:center}#cases{display:flex;justify-content:center;gap:12px;align-items:start;padding:12px}.case{overflow:hidden;border:1px solid #999;flex-shrink:0}.case label{display:block;padding:8px;background:white}iframe{display:block;border:0;transform:scale(.5);transform-origin:top left}button,a{font:inherit;min-height:32px}#metrics{white-space:pre-wrap}</style></head><body><header><strong id="title"></strong><button id="lower">Next section</button><button id="top">Top</button><button id="menu">Navigation</button><button id="search">Page finder</button><a id="direct" target="_blank">Open interactive page</a></header><div id="cases"></div><pre id="metrics"></pre><script>
const params=new URLSearchParams(location.search),role=params.get('role')||'dealer',route=params.get('route')||'/dealer',state=params.get('state')||'ready';title.textContent=role+' · '+state+' · '+route;direct.href=route;document.cookie='qa_role='+role+';path=/;SameSite=Lax';document.cookie='qa_state='+state+';path=/;SameSite=Lax';
const frames=[];for(const width of [1440,768,390]){const section=document.createElement('section');section.className='case';section.style.width=width*.5+'px';section.style.height='650px';const label=document.createElement('label');label.textContent=width+' CSS px';const frame=document.createElement('iframe');frame.width=width;frame.height=width===390?844:900;frame.title=route+' at '+width+'px';frame.src=route;section.append(label,frame);cases.append(section);frames.push(frame)}
document.getElementById('lower').onclick=()=>frames.forEach(f=>f.contentWindow.scrollBy(0,600));document.getElementById('top').onclick=()=>frames.forEach(f=>f.contentWindow.scrollTo(0,0));
document.getElementById('menu').onclick=()=>frames.forEach(f=>f.contentDocument.querySelector('button[aria-label="Open navigation"]')?.click());
document.getElementById('search').onclick=()=>frames.forEach(f=>f.contentDocument.querySelector('button[aria-label="Find a workspace page"]')?.click());
</script></body></html>
