<!doctype html><html><head><title>Veltrenne isolated responsive review</title><style>body{margin:0;background:#ddd;font:14px Arial}header{position:sticky;top:0;background:white;padding:12px;display:flex;gap:18px;align-items:center;z-index:9}button,a{font:inherit;min-height:36px}#frames{display:flex;gap:10px;justify-content:center;padding:12px}.case{overflow:hidden;border:1px solid #888;flex-shrink:0}.case label{display:block;padding:8px;background:white}iframe{display:block;transform:scale(.5);transform-origin:top left;border:0}</style></head><body><header><strong id="title"></strong><button id="lower">Next section</button><button id="top">Top</button><a id="direct">Open full page</a></header><div id="frames"></div><script>
const p=new URLSearchParams(location.search),route=p.get('route')||'/calendar',role=p.get('role')||'dealer',mode=p.get('state')||'ready';
document.cookie='qa_role='+role+';path=/;SameSite=Lax';document.cookie='qa_mode='+mode+';path=/;SameSite=Lax';document.getElementById('title').textContent=role+' · '+mode+' · '+route;direct.href=route;
const frames=[];for(const width of [1440,768,390]){const box=document.createElement('section');box.className='case';box.style.width=width*.5+'px';box.style.height='850px';const label=document.createElement('label');label.textContent=width+' CSS px';const frame=document.createElement('iframe');frame.width=width;frame.height=width===390?844:1000;frame.title=route+' at '+width+'px';frame.src=route;box.append(label,frame);document.getElementById('frames').append(box);frames.push(frame);}
lower.onclick=()=>frames.forEach(f=>f.contentWindow.scrollBy(0,500));top.onclick=()=>frames.forEach(f=>f.contentWindow.scrollTo(0,0));
</script></body></html>
