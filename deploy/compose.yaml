name: carvia
services:
  api:
    build: ../server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      MONGO_URI: ${MONGO_URI:?Set the original database connection}
      JWT_SECRET: ${JWT_SECRET:?Set a strong secret}
      CORS_ORIGINS: https://${DOMAIN:?Set the public domain}
      UPLOAD_DIR: /data/uploads
      PUBLIC_WEB_URL: https://${DOMAIN:?Set the public domain}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
    volumes:
      - uploads:/data/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5050/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
  web:
    build:
      context: ../car-platform-web
      args:
        PUBLIC_ORIGIN: https://${DOMAIN:?Set the public domain}
    environment:
      API_INTERNAL_BASE_URL: http://api:5050/api
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
  gateway:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?Set the public domain}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api
volumes:
  uploads:
  caddy_data:
  caddy_config:
